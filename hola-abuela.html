<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hola, Abuela - Gestión de Medicamentos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .celular {
            background-color: white;
            width: 340px;
            border: 4px solid #333;
            border-radius: 25px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .tarjeta-medicina {
            border: 2px solid #cbd5e1;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            background-color: #f8fafc;
        }
        .tarjeta-medicina h3 {
            margin: 0 0 10px 0;
            color: #0f172a;
        }
        .btn-tome {
            background-color: #22c55e;
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 10px;
        }
        .fila-botones {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn-receta {
            flex: 1;
            background-color: #e0f2fe;
            border: 2px solid #0284c7;
            color: #0369a1;
            padding: 20px 10px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-historial {
            flex: 1;
            background-color: #dcfce7;
            border: 2px solid #16a34a;
            color: #15803d;
            padding: 20px 10px;
            border-radius: 15px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-cuidadores {
            width: 100%;
            background-color: #f3e8ff;
            border: 2px solid #9333ea;
            color: #7e22ce;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="celular">
        <header>💙 Hola, Abuela</header>

        <div class="tarjeta-medicina">
            <h3>⏰ Próxima Medicina</h3>
            <p><strong>LOSARTÁN</strong><br>50mg - 11:00 AM</p>
            <button class="btn-tome" onclick="alert('¡Excelente! Toma registrada en el historial.')">✅ YA LA TOMÉ</button>
        </div>

        <div class="fila-botones">
            <button class="btn-receta">📷<br>Agregar Receta</button>
            <button class="btn-historial">📋<br>Historial</button>
        </div>

        <button class="btn-cuidadores">👥 Red de Cuidadores ></button>
    </div>

</body>
</html>
